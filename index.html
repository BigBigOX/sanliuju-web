<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>三六局 — 聚会破冰游戏</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="data/constants.js"></script>
<script src="data/penalties.js"></script>
<script src="state/game-state.js"></script>
<script src="state/game-log.js"></script>
<script src="engine/round-manager.js"></script>
<script src="engine/match-calc.js"></script>
<script src="engine/penalty-engine.js"></script>
<script src="ai/prompt-templates.js"></script>
<script src="ai/ai-client-v2.js"></script>
<script src="channel/supabase-channel.js"></script>
<script src="ai/tts-client.js"></script>
<script src="ai/asr-client.js"></script>
<script src="ui/renderer.js"></script>
<script src="app/actions-v2.js"></script>
<style>
  :root {
    --warm: #F97316; --warm-light: #FFF7ED; --warm-dark: #EA580C;
    --gold: #FBBF24; --gold-light: #FFFBEB;
    --bg: #0B1120; --card: rgba(255,255,255,0.04); --text: #E5E7EB; --text2: #9CA3AF;
    --border: rgba(255,255,255,0.08); --radius: 16px; --shadow: 0 4px 24px rgba(0,0,0,.3);
    --danger: #EF4444; --success: #22C55E;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    background: radial-gradient(ellipse at 20% 20%,rgba(249,115,22,.06) 0%,transparent 50%),radial-gradient(ellipse at 80% 80%,rgba(251,191,36,.08) 0%,transparent 50%),var(--bg);
    color: var(--text); line-height: 1.6; min-height: 100dvh;
  }
  .page { display: none; padding: 24px 16px 120px; max-width: 520px; margin: 0 auto; min-height: 100dvh; }
  .page.active { display: block; animation: fadeUp .35s cubic-bezier(.22,.61,.36,1); }
  .entry-hero { text-align: center; padding: 48px 0 32px; }
  .entry-logo { font-size: 56px; margin-bottom: 8px; display: inline-block; animation: scaleInBounce .6s cubic-bezier(.22,.61,.36,1); }
  .entry-title { font-size: 28px; font-weight: 800; background: linear-gradient(135deg,var(--warm),var(--warm-dark)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .entry-sub { color: var(--text2); font-size: 14px; margin-top: 4px; }
  .entry-btns { display: flex; flex-direction: column; gap: 14px; }
  .btn-big { display: block; width: 100%; padding: 18px; border-radius: var(--radius); border: none; font-size: 18px; font-weight: 700; cursor: pointer; transition: transform .15s,box-shadow .15s; position: relative; overflow: hidden; }
  .btn-big:active { transform: scale(.98); }
  .btn-host { background: var(--warm); color: #fff; box-shadow: 0 4px 16px rgba(249,115,22,.3); }
  .btn-join { background: var(--card); color: var(--warm); border: 2px solid var(--warm); }
  .room-bar { background: var(--card); border-radius: var(--radius); padding: 16px 20px; box-shadow: var(--shadow); display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  .room-code { font-size: 26px; font-weight: 800; letter-spacing: 3px; color: var(--warm); }
  .room-label { font-size: 11px; color: var(--text2); }
  .section-title { font-size: 16px; font-weight: 700; margin-bottom: 12px; color: var(--text2); }
  .hint { text-align: center; color: var(--text2); font-size: 13px; margin: 20px 0; }
  .status-badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
  .status-waiting { background: var(--gold-light); color: #B45309; }
  .status-playing { background: #DCFCE7; color: #15803D; }
  .btn { display: block; width: 100%; padding: 14px; border-radius: var(--radius); border: none; font-size: 16px; font-weight: 600; cursor: pointer; transition: transform .15s,box-shadow .2s; }
  .btn:disabled { opacity: .4; pointer-events: none; }
  .btn-primary { background: var(--warm); color: #fff; }
  .btn-ghost { background: transparent; color: var(--text2); border: 1px solid #E7E5E4; }
  .btn:not(:disabled):active { transform: scale(.96); }
  .input-row { display: flex; gap: 10px; margin-bottom: 20px; }
  .input { flex: 1; padding: 14px 16px; border: 2px solid #E7E5E4; border-radius: var(--radius); font-size: 18px; text-align: center; outline: none; font-weight: 700; }
  .input:focus { border-color: var(--warm); }
  .actions { display: flex; flex-direction: column; gap: 10px; }
  .actions-row { display: flex; gap: 10px; }
  .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #1C1917; color: #fff; padding: 10px 24px; border-radius: 24px; font-size: 14px; z-index: 999; opacity: 0; transition: opacity .3s; }
  .toast.show { opacity: 1; animation: toastIn .35s cubic-bezier(.22,.61,.36,1); }
  .console-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .round-badge { padding: 6px 16px; border-radius: 20px; font-size: 14px; font-weight: 700; background: var(--warm); color: #fff; }
  .phase-badge { display: inline-block; padding: 4px 10px; border-radius: 10px; font-size: 11px; font-weight: 600; margin-left: 8px; }
  .timer-big { font-size: 48px; font-weight: 800; text-align: center; font-variant-numeric: tabular-nums; transition: color .4s; }
  .timer-big.warn { color: var(--danger); animation: pulseWarn .6s infinite; }
  .question-card { background: var(--card); border-radius: var(--radius); padding: 24px; box-shadow: var(--shadow); text-align: center; font-size: 18px; font-weight: 600; margin: 16px 0; min-height: 80px; display: flex; align-items: center; justify-content: center; transition: transform .3s,box-shadow .3s; }
  .question-card:not(.empty) { animation: slideInRight .4s cubic-bezier(.22,.61,.36,1); }
  .question-card.empty { color: var(--text2); font-weight: 400; }
  .question-card.ai-loading { animation: aiPulse 1.2s ease-in-out infinite; background: linear-gradient(135deg,#FEF3C7,#FFF7ED,#FEF3C7); background-size: 200% 200%; font-size: 16px; color: #B45309; }
  .sync-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  .sync-dot.on { background: var(--success); }
  .sync-dot.off { background: #D4D4D8; }
  .avatar-picker { display: grid; grid-template-columns: repeat(6,1fr); gap: 10px; margin-bottom: 20px; justify-items: center; }
  .avatar-opt { width: 44px; height: 44px; border-radius: 50%; font-size: 24px; display: flex; align-items: center; justify-content: center; background: var(--card); border: 2px solid transparent; cursor: pointer; transition: transform .15s,border-color .2s,box-shadow .2s; }
  .avatar-opt:hover { transform: scale(1.12); }
  .avatar-opt:active { transform: scale(.92); }
  .avatar-opt.selected { border-color: var(--warm); box-shadow: 0 0 0 4px rgba(249,115,22,.18); transform: scale(1.1); }
  .answer-textarea { width: 100%; min-height: 80px; padding: 14px 16px; border: 2px solid #E7E5E4; border-radius: var(--radius); font-size: 16px; font-family: inherit; line-height: 1.6; resize: none; outline: none; transition: border-color .2s; }
  .answer-textarea:focus { border-color: var(--warm); }
  .answer-char-count { text-align: right; font-size: 11px; color: var(--text2); margin-top: 4px; }
  .float-room { position: relative; width: 100%; height: 380px; border-radius: 24px; background: radial-gradient(circle at 50% 50%,rgba(249,115,22,.06),transparent 70%),radial-gradient(circle at 70% 30%,rgba(251,191,36,.03),transparent 40%); border: 1px dashed rgba(249,115,22,.15); overflow: hidden; margin-bottom: 20px; }
  .player-float { position: absolute; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: left 2.5s cubic-bezier(.25,.1,.25,1),top 2.5s cubic-bezier(.25,.1,.25,1),transform .15s,box-shadow .5s; cursor: pointer; z-index: 2; }
  .player-float .pf-avatar { font-size: 28px; line-height: 1; }
  .player-float .pf-tag { font-size: 10px; font-weight: 700; color: var(--text); background: rgba(255,255,255,.85); border-radius: 10px; padding: 1px 8px; margin-top: 2px; }
  .player-float .pf-host { font-size: 9px; background: var(--gold); color: #fff; border-radius: 8px; padding: 0 6px; }
  .player-float.joined { background: var(--card); box-shadow: 0 2px 16px rgba(0,0,0,.06); animation: drift var(--drift-dur,4s) ease-in-out infinite; animation-delay: var(--drift-delay,0s); }
  .player-float.joined:hover { transform: scale(1.12); box-shadow: 0 4px 24px rgba(249,115,22,.2); z-index: 10; }
  .player-float.converged { transition: left 3s cubic-bezier(.22,.61,.36,1),top 3s cubic-bezier(.22,.61,.36,1); box-shadow: 0 0 20px rgba(34,197,94,.3); border: 2px solid var(--success); }
  .player-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; margin-bottom: 20px; }
  .player-slot { aspect-ratio: 1; border-radius: var(--radius); display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; transition: all .3s; border: 2px dashed var(--border); color: var(--text2); }
  .player-slot.joined { border-style: solid; background: var(--card); box-shadow: var(--shadow); color: var(--text); border-color: transparent; }
  .bg-orb { position: fixed; pointer-events: none; z-index: -1; border-radius: 50%; filter: blur(80px); animation: bgFloat 20s infinite; }
  .bg-orb-1 { width: 300px; height: 300px; top: -80px; right: -60px; background: rgba(249,115,22,.12); }
  .bg-orb-2 { width: 240px; height: 240px; bottom: -60px; left: -40px; background: rgba(251,191,36,.1); animation-delay: -7s; }
  @keyframes fadeUp { from{opacity:0;transform:translateY(24px)} to{opacity:1;transform:translateY(0)} }
  @keyframes scaleInBounce { 0%{opacity:0;transform:scale(.7)} 60%{opacity:1;transform:scale(1.06)} 100%{opacity:1;transform:scale(1)} }
  @keyframes slideInRight { from{opacity:0;transform:translateX(32px)} to{opacity:1;transform:translateX(0)} }
  @keyframes pulseWarn { 0%,100%{transform:scale(1);color:var(--danger)} 50%{transform:scale(1.08);color:#DC2626} }
  @keyframes toastIn { from{opacity:0;transform:translateX(-50%) translateY(-20px)} to{opacity:1;transform:translateX(-50%) translateY(0)} }
  @keyframes bgFloat { 0%,100%{transform:translate(0,0)rotate(0deg);opacity:.04} 33%{transform:translate(30px,-20px)rotate(1deg);opacity:.07} 66%{transform:translate(-20px,10px)rotate(-1deg);opacity:.05} }
  @keyframes drift { 0%,100%{transform:translate(0,0)} 25%{transform:translate(var(--drift-x),var(--drift-y))} 50%{transform:translate(calc(var(--drift-x)*-0.6),calc(var(--drift-y)*0.8))} 75%{transform:translate(calc(var(--drift-x)*0.4),calc(var(--drift-y)*-0.7))} }
  @keyframes aiPulse { 0%,100%{opacity:1} 50%{opacity:.4} }
  @media (max-width:400px) { .player-grid { grid-template-columns: repeat(2,1fr) } .btn-big { padding:14px; font-size:16px } }
</style>
</head>
<body>
<div class="bg-orb bg-orb-1"></div><div class="bg-orb bg-orb-2"></div>
<div id="toast" class="toast"></div>

<!-- Entry -->
<div id="page-entry" class="page active">
  <div class="entry-hero">
    <div class="entry-logo">🦊</div>
    <div class="entry-title">三六局</div>
    <div class="entry-sub">三轮问答 · 找出最默契的人</div>
  </div>
  <div id="rejoin-banner" style="display:none;margin-bottom:16px;padding:14px 18px;background:var(--warm-light);border-radius:var(--radius);text-align:center;border:2px solid var(--warm);">
    <div style="font-size:14px;font-weight:600;color:var(--warm-dark);margin-bottom:6px;" id="rejoin-text"></div>
    <div style="display:flex;gap:8px;justify-content:center;">
      <button class="btn btn-primary" onclick="App.rejoin()" style="font-size:14px;padding:10px 24px;width:auto;">🔄 重新加入</button>
      <button class="btn btn-ghost" onclick="App.dismissRejoin()" style="font-size:14px;padding:10px 18px;width:auto;">忽略</button>
    </div>
  </div>
  <div id="profile-list" style="display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-bottom:20px;"></div>
  <div class="entry-btns">
    <button class="btn-big btn-join" onclick="App.showNewName()">✏️ 使用新名字</button>
  </div>
  <div id="new-name-form" style="display:none;margin-top:16px;">
    <div class="input-row"><input class="input" id="new-name-input" placeholder="输入你的名字" maxlength="8" autocomplete="off"></div>
    <p class="hint" style="margin-bottom:8px;">选一个头像</p>
    <div class="avatar-picker" id="new-name-avatar-picker"></div>
    <div style="display:flex;gap:10px;margin-top:12px;">
      <button class="btn btn-primary" onclick="App.saveNewProfile()">确认 → 选择角色</button>
      <button class="btn btn-ghost" onclick="App.hideNewName()" style="flex:none;width:auto;">取消</button>
    </div>
  </div>
  <div style="display:flex;gap:10px;justify-content:center;margin-top:24px;flex-wrap:wrap;">
    <a href="rules.html" style="color:var(--text2);text-decoration:none;font-size:13px;padding:8px 18px;background:var(--card);border-radius:20px;">📖 规则</a>
    <a href="penalties.html" style="color:var(--text2);text-decoration:none;font-size:13px;padding:8px 18px;background:var(--card);border-radius:20px;">📋 惩罚模板</a>
    <a href="debug.html" style="color:var(--text2);text-decoration:none;font-size:13px;padding:8px 18px;background:var(--card);border-radius:20px;">🔍 调试</a>
  </div>
</div>

<!-- Role Pick -->
<div id="page-role-pick" class="page">
  <div class="entry-hero" style="padding-top:32px;">
    <div class="entry-logo" style="font-size:40px;" id="role-avatar"></div>
    <div class="entry-title" style="font-size:22px;" id="role-name"></div>
  </div>
  <p class="hint">三轮问答 · 文字交锋 · 默契揭晓<br>看看谁和你最对味 👀</p>
  <div class="entry-btns">
    <button class="btn-big btn-host" onclick="App.goHost()">👑 主持人</button>
    <button class="btn-big btn-join" onclick="App.showJoinRoom()">🎭 加入聚会</button>
  </div>
  <button class="btn btn-ghost" style="margin-top:16px;" onclick="if(confirm('确定返回首页吗？'))App.goEntry()">🔄 切换身份</button>
</div>

<!-- Host Wait -->
<div id="page-host-wait" class="page">
  <h2 style="font-size:20px;margin-bottom:16px;">👑 主持人控制台</h2>
  <div class="room-bar">
    <div><div class="room-label">房间号</div><div class="room-code" id="host-room-id">------</div></div>
    <span class="status-badge status-waiting">等待中</span>
  </div>
  <div class="section-title">玩家列表</div>
  <p class="hint" id="host-wait-hint">等待玩家加入…</p>
  <div class="float-room" id="host-player-room"></div>
  <div class="actions">
    <button class="btn btn-primary" id="host-start-btn" disabled onclick="App.hostStartGame()">开始游戏（至少2人）</button>
    <button class="btn btn-ghost" onclick="App.goEntry()">返回</button>
  </div>
</div>

<!-- Host Console -->
<div id="page-host-console" class="page">
  <div class="console-header">
    <div><span class="round-badge" id="console-round-badge">信息采集</span><span class="phase-badge" id="phase-badge" style="background:var(--gold-light);color:#B45309;"></span></div>
    <span><span class="sync-dot on"></span>同步中</span>
    <button class="btn" style="width:auto;padding:6px 14px;font-size:13px;" onclick="App.goEntry()">退出</button>
  </div>
  <div style="text-align:center;font-size:12px;color:var(--text2);margin-bottom:4px;" id="question-info"></div>
  <div id="host-script-card" style="display:none;margin:8px 0;padding:12px 16px;background:linear-gradient(135deg,#FFFBEB,#FEF3C7);border-radius:12px;border-left:3px solid var(--gold);font-size:14px;font-weight:600;color:#B45309;display:flex;align-items:center;gap:8px;">
    <span style="font-size:20px;">📢</span>
    <span id="host-script-text"></span>
  </div>
  <div class="timer-big" id="console-timer">--</div>
  <div class="question-card empty" id="console-question">点「来一题」开始</div>
  <div id="answered-count" style="text-align:center;font-size:12px;color:var(--text2);margin-bottom:8px;"></div>
  <div id="host-answers" style="margin:8px 0;padding:8px;background:var(--card);border-radius:12px;max-height:200px;overflow-y:auto;"></div>
  <div id="match-result" style="display:none;margin:12px 0;padding:14px;background:rgba(249,115,22,0.06);border:1px solid rgba(249,115,22,0.15);border-radius:var(--radius);">
    <div style="font-size:14px;font-weight:700;margin-bottom:8px;color:var(--warm);">📊 匹配结果</div>
    <div id="match-pairs" style="display:flex;flex-direction:column;gap:6px;"></div>
    <div id="match-analysis" style="font-size:12px;color:var(--text);margin-top:8px;line-height:1.7;"></div>
  </div>
  <div id="host-vote-status" style="display:none;margin:12px 0;padding:14px;background:linear-gradient(135deg,#FEF3C7,#FFF7ED);border-radius:var(--radius);box-shadow:var(--shadow);">
    <div style="font-size:13px;font-weight:700;margin-bottom:6px;" id="host-vote-title"></div>
    <div id="host-vote-candidates" style="display:flex;flex-direction:column;gap:4px;"></div>
    <div id="host-vote-progress" style="font-size:11px;color:var(--text2);margin-top:6px;"></div>
  </div>
  <div class="actions" style="margin-bottom:12px;">
    <button class="btn btn-primary" id="console-question-btn" onclick="App.hostGenerateQuestion()">🎲 来一题</button>
    <button class="btn btn-ghost" id="console-nextround-btn" onclick="App.hostNextRound()" style="display:none;">→ 进入结算</button>
  </div>
  <div class="actions-row" id="admin-btns" style="display:none;">
    <button class="btn btn-ghost" id="btn-reopen" onclick="App.adminReopenQuestion()" style="font-size:12px;flex:1;">🔄 重新作答</button>
    <button class="btn btn-ghost" id="btn-skip-q" onclick="App.adminSkipQuestion()" style="font-size:12px;flex:1;">⏭️ 跳过</button>
    <button class="btn btn-ghost" id="btn-skip-p" onclick="App.adminSkipPenalty()" style="font-size:12px;flex:1;">⏭️ 跳过惩罚</button>
  </div>
  <div class="section-title" style="margin-top:16px;">默契度可视化</div>
  <div class="float-room" id="host-player-room" style="height:240px;"></div>
</div>

<!-- Settlement (shared host/player) -->
<div id="settlement-section" class="page">
  <div class="entry-hero" style="padding-top:24px;">
    <div style="font-size:48px;" id="settlement-icon">📊</div>
    <div class="entry-title" style="font-size:22px;" id="settlement-title">轮次结算</div>
    <div class="entry-sub" id="settlement-sub"></div>
  </div>
  <div id="settlement-pairs" style="margin-bottom:16px;"></div>
  <div id="settlement-jealousy" style="display:none;padding:12px;background:linear-gradient(135deg,#FEF2F2,#FFF7ED);border-radius:var(--radius);box-shadow:var(--shadow);text-align:center;margin-bottom:16px;">
    <div style="font-size:14px;font-weight:700;margin-bottom:8px;">😈 嫉妒值揭晓 — 有人心动的人跟别人更默契…</div>
    <div id="jealousy-list" style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center;"></div>
  </div>
  <div class="actions">
    <button class="btn btn-primary" id="settlement-next-btn" onclick="App.hostNextRound()">→ 进入下一轮</button>
  </div>
</div>

<!-- Player Join -->
<div id="page-player-join" class="page">
  <h2 style="font-size:20px;text-align:center;margin-bottom:16px;">🎭 加入聚会</h2>
  <p class="hint" id="join-profile-label"></p>
  <div class="input-row"><input class="input" id="join-input" placeholder="输入房间号" maxlength="6" autocomplete="off"></div>
  <div class="actions">
    <button class="btn btn-primary" id="join-btn" onclick="App.playerJoin()">加入房间</button>
    <button class="btn btn-ghost" onclick="App.goEntry()">返回</button>
  </div>
</div>

<!-- Player Board -->
<div id="page-player-board" class="page" style="background:linear-gradient(180deg,#0B1120 0%,#131A2E 100%);">
  <!-- Top bar -->
  <div style="display:flex;align-items:center;justify-content:space-between;padding:4px 0 12px;">
    <div style="display:flex;align-items:center;gap:8px;">
      <span class="round-badge" id="player-round-badge" style="display:none;background:var(--warm);color:#fff;padding:4px 14px;border-radius:20px;font-size:13px;font-weight:700;"></span>
      <span style="font-size:11px;color:var(--t3);" id="player-phase-text"></span>
    </div>
    <div style="display:flex;align-items:center;gap:10px;">
      <span style="font-size:12px;color:var(--t3);font-weight:600;" id="player-room-tag"></span>
      <button onclick="if(confirm('确定退出游戏吗？'))App.goEntry()" style="background:none;border:1px solid var(--border);color:var(--text3);padding:4px 10px;border-radius:12px;font-size:11px;cursor:pointer;">退出</button>
    </div>
  </div>

  <!-- Waiting state -->
  <div id="player-waiting-area" style="text-align:center;padding-top:48px;">
    <div style="width:12px;height:12px;border-radius:50%;background:var(--warm);margin:0 auto 20px;animation:pulse 2s ease-in-out infinite;box-shadow:0 0 16px rgba(249,115,22,.4);"></div>
    <div style="font-size:20px;font-weight:700;color:#E5E7EB;margin-bottom:12px;">等待游戏开始</div>
    <div style="font-size:13px;color:var(--t2);margin-bottom:4px;">房间号</div>
    <div style="color:var(--warm);font-weight:800;font-size:26px;letter-spacing:3px;" id="player-wait-room-code"></div>
    <div id="player-wait-avatars" style="display:flex;justify-content:center;gap:14px;margin-top:28px;flex-wrap:wrap;"></div>
  </div>

  <!-- Game state -->
  <div id="player-game-area" style="display:none;">
    <!-- Timer ring -->
    <div style="display:flex;justify-content:center;margin:8px 0 16px;">
      <div id="player-timer-wrap" style="position:relative;width:100px;height:100px;display:none;">
        <svg width="100" height="100" viewBox="0 0 100 100">
          <circle cx="50" cy="50" r="42" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="6"/>
          <circle cx="50" cy="50" r="42" fill="none" stroke="var(--warm)" stroke-width="6"
            stroke-dasharray="263.9" stroke-dashoffset="0" stroke-linecap="round"
            transform="rotate(-90 50 50)" id="player-timer-ring" style="transition:stroke-dashoffset 1s linear,stroke .4s;"/>
        </svg>
        <div id="player-timer-text" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--text);">--</div>
      </div>
    </div>

    <!-- Question card -->
    <div class="question-card empty" id="player-question" style="
      background:rgba(255,255,255,0.04);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
      border:1px solid rgba(255,255,255,0.08);border-radius:20px;padding:24px 20px;
      text-align:center;font-size:18px;font-weight:600;min-height:80px;
      display:flex;align-items:center;justify-content:center;margin-bottom:16px;
      transition:all .3s ease;
    ">等待出题…</div>

    <!-- Answer area -->
    <div id="player-answer-area" style="display:none;">
      <textarea class="answer-textarea" id="player-answer-input" placeholder="写下你的回答…" maxlength="50"
        oninput="document.getElementById('answer-count').textContent=this.value.length"
        style="width:100%;min-height:72px;padding:14px 16px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);border-radius:16px;font-size:16px;color:var(--text);resize:none;outline:none;font-family:inherit;line-height:1.6;transition:border-color .2s;"></textarea>
      <div class="answer-char-count" style="text-align:right;font-size:11px;color:var(--t3);margin:4px 0 10px;"><span id="answer-count">0</span> / 50</div>
      <div style="display:flex;gap:10px;">
        <button class="btn btn-primary" id="player-answer-btn" onclick="App.submitAnswer(document.getElementById('player-answer-input').value)"
          style="flex:1;border-radius:16px;padding:15px;font-size:16px;font-weight:700;background:var(--warm);color:#fff;border:none;cursor:pointer;transition:all .2s;">提交回答</button>
        <button id="player-mic-btn"
          onmousedown="App.voiceStart()" onmouseup="App.voiceStop()" onmouseleave="App.voiceStop()"
          ontouchstart="App.voiceStart()" ontouchend="App.voiceStop()" ontouchcancel="App.voiceStop()"
          style="flex:1;padding:15px;border-radius:16px;background:rgba(255,255,255,0.04);border:2px solid rgba(255,255,255,0.1);color:var(--text);font-size:14px;font-weight:600;cursor:pointer;transition:all .2s;user-select:none;-webkit-user-select:none;touch-action:manipulation;display:flex;align-items:center;justify-content:center;gap:6px;">🎤 按住说话 · 松开发送</button>
      </div>
    </div>

    <!-- Match result -->
    <div id="player-match-result" style="display:none;margin-top:12px;">
      <div style="font-size:16px;font-weight:800;color:var(--warm);margin-bottom:12px;text-align:center;animation:fadeUp .5s ease;">🎯 默契揭晓</div>
      <div id="player-match-pairs" style="display:flex;flex-direction:column;gap:8px;margin-bottom:10px;"></div>
      <div id="player-match-text" style="font-size:12px;color:var(--t2);text-align:center;line-height:1.8;padding:12px;background:rgba(249,115,22,0.04);border-radius:14px;border:1px solid rgba(249,115,22,0.08);"></div>
    </div>

    <!-- Vote panel -->
    <div id="player-vote-panel" style="display:none;margin-top:12px;"></div>
  </div>

  <!-- Player list -->
  <div style="margin-top:20px;">
    <div style="font-size:11px;color:var(--t3);margin-bottom:8px;font-weight:600;">玩家</div>
    <div id="player-board-players" style="display:flex;gap:10px;flex-wrap:wrap;"></div>
  </div>
</div>

<!-- Game End -->
<div id="page-game-end" class="page">
  <div class="entry-hero" style="padding-top:32px;">
    <div style="font-size:56px;" id="end-icon">🎉</div>
    <div class="entry-title">游戏结束</div>
    <div class="entry-sub" id="end-report"></div>
  </div>
  <div id="end-results" style="margin-top:20px;"></div>
  <button class="btn btn-primary" onclick="App.goEntry()" style="margin-top:24px;">返回首页</button>
</div>

<script>
(function(){
  const stateManager = window.GameState.createState()
  window.stateManager = stateManager; const S = stateManager.state

  const roundManager = window.RoundManager.createRoundManager(stateManager)
  const matchCalc = window.MatchCalc.createMatchCalc(stateManager)
  const penaltyEngine = window.PenaltyEngine.createPenaltyEngine(stateManager)
  const renderer = window.Renderer.createRenderer(stateManager)

  const actions = window.AppActions.createActions(stateManager)
  actions.init(roundManager, matchCalc, penaltyEngine, renderer.render)
  window.Actions = actions; window.S = S

  const App = {
    showNewName() {
      $('new-name-form').style.display = ''
      const picker = $('new-name-avatar-picker')
      const avatars = window.CONSTANTS.AVATARS
      picker.innerHTML = avatars.map(a => `<div class="avatar-opt${window._selAvatar===a?' selected':''}" onclick="document.querySelectorAll('.avatar-opt').forEach(e=>e.classList.remove('selected'));this.classList.add('selected');window._selAvatar='${a}'">${a}</div>`).join('')
      window._selAvatar = avatars[Math.floor(Math.random()*avatars.length)]
      picker.querySelector('.avatar-opt')?.classList.add('selected')
    },
    hideNewName() { $('new-name-form').style.display = 'none'; $('new-name-input').value = '' },
    saveNewProfile() {
      const name = $('new-name-input').value.trim(); if(!name){renderer.toast('请输入名字');return}
      const avatar = window._selAvatar||'🎭'; const prof = actions.createProfile(name,avatar)
      const l = actions.loadProfiles(); l.push(prof); actions.saveProfiles(l)
      $('new-name-form').style.display = 'none'; $('new-name-input').value = ''
      App.pickRole(prof)
    },
    useProfile(id) { const l = actions.loadProfiles(); const p = l.find(x=>x.id===id); if(p){actions.touchProfile(id);App.pickRole(p)} },
    pickRole(prof) {
      S.profile = prof; $('role-avatar').textContent = prof.avatar||'🎭'; $('role-name').textContent = prof.name
      document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'))
      $('page-role-pick').classList.add('active')
    },
    switchProfile() { S.profile=null; document.querySelectorAll('.page').forEach(p=>p.classList.remove('active')); $('page-entry').classList.add('active'); renderer.renderEntry() },
    goHost() { if(!S.profile)return; const id=window.Channel.genRoomId(); actions.goHost(S.profile,id) },
    hostStartGame() { actions.hostStartGame() },
    hostGenerateQuestion() { if(S.game.question&&S.game.timerRunning)return; actions.hostGenerateQuestion() },
    hostNextRound() {
      if (S.game.roundPhase === 'settlement') { $('settlement-section').style.display = 'none'; $('settlement-section').classList.remove('active') }
      actions.hostNextRound()
    },
    hostEndGame() { actions.hostEndGame() },
    showJoinRoom() {
      if(!S.profile)return; $('join-profile-label').textContent = (S.profile.avatar||'🎭')+' '+S.profile.name
      document.querySelectorAll('.page').forEach(p=>p.classList.remove('active')); $('page-player-join').classList.add('active')
    },
    playerJoin() {
      const id = $('join-input').value.trim(); if(!id||id.length!==6){renderer.toast('请输入6位房间号');return}
      if(!S.profile)return; actions.goPlayer(S.profile,id)
    },
    submitAnswer(text) { if(!text.trim()){renderer.toast('请输入回答');return}; actions.submitAnswer(text); $('player-answer-input').value=''; $('answer-count').textContent='0'; renderer.toast('回答已提交 ✅') },
    castVote(idx) { S._myVote = idx; actions.castVote(idx); renderer.render(); },
    rejoin() { if(actions.rejoin()){renderer.toast('已恢复连接')}else{renderer.toast('房间已失效')} },
    dismissRejoin() { stateManager.clearSession(); $('rejoin-banner').style.display='none' },
    adminSkipPenalty() { actions.adminSkipPenalty(); renderer.toast('惩罚已跳过') },
    adminSkipQuestion() { actions.adminSkipQuestion(); renderer.toast('题目已跳过') },
    adminReopenQuestion() { actions.adminReopenQuestion(); renderer.toast('重新计时，继续作答') },
    async voiceStart() {
      const btn = $('player-mic-btn'); const input = $('player-answer-input')
      if (!btn || !input || !window.ASR || window._recording) return
      try {
        await window.ASR.startRecording()
        window._recording = true
        btn.textContent = '🔴'; btn.style.background = 'var(--danger)'
        btn.style.transform = 'scale(1.1)'
        renderer.toast('录音中…松开发送')
      } catch(e) { renderer.toast('麦克风权限未授权') }
    },
    async voiceStop() {
      const btn = $('player-mic-btn'); const input = $('player-answer-input')
      if (!btn || !window._recording) return
      window._recording = false
      btn.textContent = '⏳'; btn.style.background = 'var(--gold-light)'; btn.style.transform = ''
      try {
        const blob = await window.ASR.stopRecording()
        if (blob) {
          const text = await window.ASR.recognize(blob, S.room?.id || '0', S.playerId)
          if (text && input) { input.value = text; $('answer-count').textContent = text.length; renderer.toast('语音识别完成') }
          else { renderer.toast('未识别到语音') }
        }
      } catch(e) { renderer.toast('识别失败') }
      btn.textContent = '🎤'; btn.style.background = ''
    },
    goEntry() {
      if(S.role==='host'||S.role==='player')window.Channel.leaveRoom()
      stateManager.reset()
      const ss=$('settlement-section'); if(ss)ss.style.display='none'
      document.querySelectorAll('.page').forEach(p=>p.classList.remove('active')); $('page-entry').classList.add('active')
      renderer.renderEntry()
    }
  }
  window.App = App

  function $(id) { return document.getElementById(id) }

  function init() {
    const session = stateManager.loadSession()
    if (session && session.roomId) {
      const age = session.savedAt ? Math.round((Date.now()-session.savedAt)/60000) : 0
      const ageStr = age<1?'刚刚':age<60?`${age}分钟前`:`${Math.round(age/60)}小时前`
      $('rejoin-text').textContent = `上次游戏 · ${ageStr} · ${session.role==='host'?'主持人':'玩家'} · 房间 ${session.roomId} · 第${session.round||'?'}轮`
      $('rejoin-banner').style.display = ''
    }
    renderer.renderEntry()
  }
  init()
})()
</script>
</body>
</html>
