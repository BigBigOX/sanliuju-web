<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>三六局 — 聚会破冰游戏</title>
<style>
  :root {
    --warm: #F97316; --warm-light: #FFF7ED; --warm-dark: #EA580C;
    --gold: #FBBF24; --gold-light: #FFFBEB;
    --bg: #FFFBF5; --card: #FFFFFF; --text: #1C1917; --text2: #78716C;
    --border: #FDE68A; --radius: 16px; --shadow: 0 4px 24px rgba(0,0,0,.06);
    --danger: #EF4444; --success: #22C55E;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.6;
    min-height: 100dvh;
  }

  /* ===== Pages ===== */
  .page { display: none; padding: 24px 16px; max-width: 520px; margin: 0 auto; min-height: 100dvh; }
  .page.active { display: block; }

  /* ===== Entry ===== */
  .entry-hero { text-align: center; padding: 48px 0 32px; }
  .entry-logo { font-size: 56px; margin-bottom: 8px; }
  .entry-title { font-size: 28px; font-weight: 800; background: linear-gradient(135deg, var(--warm), var(--warm-dark)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .entry-sub { color: var(--text2); font-size: 14px; margin-top: 4px; }
  .entry-btns { display: flex; flex-direction: column; gap: 14px; }
  .btn-big {
    display: block; width: 100%; padding: 18px; border-radius: var(--radius);
    border: none; font-size: 18px; font-weight: 700; cursor: pointer;
    transition: transform .15s, box-shadow .15s;
  }
  .btn-big:active { transform: scale(.98); }
  .btn-host { background: var(--warm); color: #fff; box-shadow: 0 4px 16px rgba(249,115,22,.3); }
  .btn-join  { background: var(--card); color: var(--warm); border: 2px solid var(--warm); }

  /* ===== Room Bar ===== */
  .room-bar {
    background: var(--card); border-radius: var(--radius); padding: 16px 20px;
    box-shadow: var(--shadow); display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 20px;
  }
  .room-code { font-size: 26px; font-weight: 800; letter-spacing: 3px; color: var(--warm); }
  .room-label { font-size: 11px; color: var(--text2); }

  /* ===== Player Grid ===== */
  .section-title { font-size: 16px; font-weight: 700; margin-bottom: 12px; color: var(--text2); }
  .player-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
  .player-slot {
    aspect-ratio: 1; border-radius: var(--radius); display: flex;
    flex-direction: column; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 600; transition: all .3s;
    border: 2px dashed var(--border); color: var(--text2);
  }
  .player-slot.joined {
    border-style: solid; background: var(--card); box-shadow: var(--shadow);
    color: var(--text); border-color: transparent;
  }
  .player-slot .p-num { font-size: 20px; font-weight: 800; }
  .player-slot .p-name { font-size: 12px; margin-top: 4px; }
  .player-slot .host-badge {
    font-size: 10px; background: var(--gold); color: #fff; padding: 2px 8px;
    border-radius: 20px; margin-top: 4px;
  }

  /* ===== Controls ===== */
  .actions { display: flex; flex-direction: column; gap: 10px; }
  .btn {
    display: block; width: 100%; padding: 14px; border-radius: var(--radius);
    border: none; font-size: 16px; font-weight: 600; cursor: pointer;
  }
  .btn:disabled { opacity: .4; pointer-events: none; }
  .btn-primary { background: var(--warm); color: #fff; }
  .btn-ghost { background: transparent; color: var(--text2); border: 1px solid #E7E5E4; }

  /* ===== Input ===== */
  .input-row { display: flex; gap: 10px; margin-bottom: 20px; }
  .input {
    flex: 1; padding: 14px 16px; border: 2px solid #E7E5E4; border-radius: var(--radius);
    font-size: 18px; text-align: center; letter-spacing: 2px; outline: none;
    text-transform: uppercase; font-weight: 700;
  }
  .input:focus { border-color: var(--warm); }

  /* ===== Hint ===== */
  .hint { text-align: center; color: var(--text2); font-size: 13px; margin: 20px 0; }
  .status-badge {
    display: inline-block; padding: 4px 12px; border-radius: 20px;
    font-size: 12px; font-weight: 600;
  }
  .status-waiting { background: var(--gold-light); color: #B45309; }
  .status-playing { background: #DCFCE7; color: #15803D; }

  /* ===== Toast ===== */
  .toast {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
    background: #1C1917; color: #fff; padding: 10px 24px; border-radius: 24px;
    font-size: 14px; z-index: 999; opacity: 0; transition: opacity .3s;
  }
  .toast.show { opacity: 1; }

  /* ===== Console (host game view) ===== */
  .console-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .round-badge {
    padding: 6px 16px; border-radius: 20px; font-size: 14px; font-weight: 700;
    background: var(--warm); color: #fff;
  }
  .timer-big { font-size: 48px; font-weight: 800; text-align: center; font-variant-numeric: tabular-nums; }
  .timer-big.warn { color: var(--danger); }
  .question-card {
    background: var(--card); border-radius: var(--radius); padding: 24px;
    box-shadow: var(--shadow); text-align: center; font-size: 18px;
    font-weight: 600; margin: 16px 0; min-height: 80px;
    display: flex; align-items: center; justify-content: center;
  }
  .question-card.empty { color: var(--text2); font-weight: 400; }
  .coin-row { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; }
  .coin-row .player-tag { font-weight: 600; font-size: 14px; }
  .coin-btns { display: flex; gap: 8px; }
  .coin-btn {
    width: 36px; height: 36px; border-radius: 50%; border: none;
    font-size: 18px; font-weight: 700; cursor: pointer; color: #fff;
  }
  .coin-btn.plus  { background: var(--success); }
  .coin-btn.minus { background: var(--danger); }

  /* ===== Player board ===== */
  .player-header { text-align: center; font-size: 18px; font-weight: 700; margin-bottom: 16px; }
  .board-actions { display: flex; gap: 10px; margin-top: 16px; }
  .heart-btn, .spark-btn {
    flex: 1; padding: 20px; border-radius: var(--radius); border: none;
    font-size: 32px; cursor: pointer; transition: transform .1s;
  }
  .heart-btn { background: #FEE2E2; }
  .heart-btn:active { transform: scale(.9); }
  .spark-btn { background: var(--gold-light); }
  .spark-btn:active { transform: scale(.9); }

  /* ===== Synced state indicator ===== */
  .sync-dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    margin-right: 6px;
  }
  .sync-dot.on  { background: var(--success); }
  .sync-dot.off { background: #D4D4D8; }

  @media (max-width: 400px) {
    .player-grid { grid-template-columns: repeat(2, 1fr); }
    .btn-big { padding: 14px; font-size: 16px; }
  }

  /* ===== Animation Keyframes ===== */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-16px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes scaleIn {
    from { opacity: 0; transform: scale(.88); }
    to   { opacity: 1; transform: scale(1); }
  }
  @keyframes scaleInBounce {
    0%   { opacity: 0; transform: scale(.7); }
    60%  { opacity: 1; transform: scale(1.06); }
    100% { opacity: 1; transform: scale(1); }
  }
  @keyframes slideInRight {
    from { opacity: 0; transform: translateX(32px); }
    to   { opacity: 1; transform: translateX(0); }
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.06); }
  }
  @keyframes pulseWarn {
    0%, 100% { transform: scale(1); color: var(--danger); }
    50%      { transform: scale(1.08); color: #DC2626; }
  }
  @keyframes toastIn {
    from { opacity: 0; transform: translateX(-50%) translateY(-20px); }
    to   { opacity: 1; transform: translateX(-50%) translateY(0); }
  }
  @keyframes roomCodeReveal {
    from { opacity: 0; filter: blur(8px); transform: translateY(-8px); }
    to   { opacity: 1; filter: blur(0); transform: translateY(0); }
  }
  @keyframes glowPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(249,115,22,.35); }
    50%      { box-shadow: 0 0 0 12px rgba(249,115,22,0); }
  }
  @keyframes shimmer {
    0%   { background-position: -200% center; }
    100% { background-position: 200% center; }
  }
  @keyframes bgFloat {
    0%, 100% { transform: translate(0, 0) rotate(0deg); opacity: .04; }
    33%      { transform: translate(30px, -20px) rotate(1deg); opacity: .07; }
    66%      { transform: translate(-20px, 10px) rotate(-1deg); opacity: .05; }
  }

  /* ===== Page Transitions ===== */
  .page { animation: fadeUp .35s cubic-bezier(.22,.61,.36,1); }
  .page.exit-left {
    animation: fadeUp .3s cubic-bezier(.22,.61,.36,1) reverse both;
    pointer-events: none;
  }

  /* ===== Enhanced Body ===== */
  body {
    background:
      radial-gradient(ellipse at 20% 20%, rgba(249,115,22,.06) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 80%, rgba(251,191,36,.08) 0%, transparent 50%),
      var(--bg);
  }

  /* ===== Entry Hero ===== */
  .entry-logo {
    animation: scaleInBounce .6s cubic-bezier(.22,.61,.36,1);
    display: inline-block;
    filter: drop-shadow(0 4px 12px rgba(249,115,22,.25));
    transition: transform .3s;
    cursor: default;
  }
  .entry-logo:hover  { transform: scale(1.08) rotate(-5deg); }
  .entry-logo:active { transform: scale(.9) rotate(5deg); }
  .entry-title { animation: fadeUp .5s .15s cubic-bezier(.22,.61,.36,1) both; }
  .entry-sub   { animation: fadeUp .5s .25s cubic-bezier(.22,.61,.36,1) both; }

  /* ===== Buttons ===== */
  .btn-big {
    transition: transform .2s cubic-bezier(.22,.61,.36,1), box-shadow .2s, background .3s;
    position: relative; overflow: hidden;
  }
  .btn-big::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(135deg, transparent 40%, rgba(255,255,255,.15) 50%, transparent 60%);
    background-size: 200% 200%;
    animation: shimmer 3s infinite;
    pointer-events: none;
  }
  .btn-big:hover  { transform: translateY(-2px); }
  .btn-big:active { transform: scale(.96); }
  .btn-host:hover { box-shadow: 0 8px 28px rgba(249,115,22,.4); }
  .btn-join:hover {
    box-shadow: 0 8px 28px rgba(249,115,22,.15);
    border-color: var(--warm-dark);
  }

  .btn {
    transition: transform .15s cubic-bezier(.22,.61,.36,1), box-shadow .2s, opacity .2s, background .3s;
  }
  .btn:not(:disabled):hover  { transform: translateY(-1px); }
  .btn:not(:disabled):active { transform: scale(.96); }
  .btn-primary:not(:disabled):hover {
    box-shadow: 0 6px 24px rgba(249,115,22,.4);
  }
  .btn-primary:not(:disabled) { animation: glowPulse 2.5s infinite; }

  /* ===== Room Bar ===== */
  .room-bar {
    animation: fadeDown .4s .1s cubic-bezier(.22,.61,.36,1) both;
    transition: box-shadow .3s, transform .2s;
  }
  .room-bar:hover { box-shadow: 0 6px 32px rgba(0,0,0,.1); }
  .room-code {
    animation: roomCodeReveal .5s .2s cubic-bezier(.22,.61,.36,1) both;
  }

  /* ===== Player Grid ===== */
  .player-slot {
    transition: transform .25s cubic-bezier(.22,.61,.36,1), box-shadow .3s, border-color .3s, background .3s;
    animation: scaleIn .4s var(--slot-delay, 0s) cubic-bezier(.22,.61,.36,1) both;
  }
  .player-slot.joined:hover {
    transform: translateY(-4px);
    box-shadow: 0 8px 28px rgba(0,0,0,.1);
  }
  .player-slot.slot-join-flash {
    animation: scaleInBounce .5s cubic-bezier(.22,.61,.36,1);
    border-color: var(--warm) !important;
    box-shadow: 0 0 0 4px rgba(249,115,22,.2);
  }

  /* ===== Question Card ===== */
  .question-card {
    transition: transform .3s cubic-bezier(.22,.61,.36,1), box-shadow .3s;
  }
  .question-card:not(.empty) { animation: slideInRight .4s cubic-bezier(.22,.61,.36,1); }
  .question-card:hover        { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(0,0,0,.08); }

  /* ===== Timer ===== */
  .timer-big { transition: color .4s; }
  .timer-big.warn { animation: pulseWarn .6s infinite; }

  /* ===== Status Badge ===== */
  .status-badge { transition: background .4s, color .4s, transform .2s; }

  /* ===== Toast ===== */
  .toast.show { animation: toastIn .35s cubic-bezier(.22,.61,.36,1); }

  /* ===== Reaction Buttons ===== */
  .heart-btn, .spark-btn {
    transition: transform .12s cubic-bezier(.22,.61,.36,1), box-shadow .2s;
  }
  .heart-btn:hover { transform: scale(1.06); box-shadow: 0 4px 16px rgba(239,68,68,.15); }
  .spark-btn:hover { transform: scale(1.06); box-shadow: 0 4px 16px rgba(251,191,36,.2); }
  .heart-btn:active, .spark-btn:active { transform: scale(.85); }
  .heart-btn.flash {
    animation: scaleInBounce .45s cubic-bezier(.22,.61,.36,1);
    box-shadow: 0 0 0 16px rgba(239,68,68,.25);
  }
  .spark-btn.flash {
    animation: scaleInBounce .45s cubic-bezier(.22,.61,.36,1);
    box-shadow: 0 0 0 16px rgba(251,191,36,.25);
  }

  /* ===== Coin Controls ===== */
  .coin-btn { transition: transform .15s, box-shadow .15s; }
  .coin-btn:hover  { transform: scale(1.15); }
  .coin-btn:active { transform: scale(.85); }
  .coin-btn.plus:hover  { box-shadow: 0 0 12px rgba(34,197,94,.4); }
  .coin-btn.minus:hover { box-shadow: 0 0 12px rgba(239,68,68,.4); }

  /* ===== Background Orbs ===== */
  .bg-orb {
    position: fixed; pointer-events: none; z-index: -1;
    border-radius: 50%; filter: blur(80px);
    animation: bgFloat 20s infinite;
  }
  .bg-orb-1 {
    width: 300px; height: 300px; top: -80px; right: -60px;
    background: rgba(249,115,22,.12); animation-delay: 0s;
  }
  .bg-orb-2 {
    width: 240px; height: 240px; bottom: -60px; left: -40px;
    background: rgba(251,191,36,.1); animation-delay: -7s;
  }

  /* ===== Floating Room ===== */
  @keyframes drift {
    0%, 100% { transform: translate(0, 0); }
    25%      { transform: translate(var(--drift-x), var(--drift-y)); }
    50%      { transform: translate(calc(var(--drift-x) * -0.6), calc(var(--drift-y) * 0.8)); }
    75%      { transform: translate(calc(var(--drift-x) * 0.4), calc(var(--drift-y) * -0.7)); }
  }
  .float-room {
    position: relative;
    width: 100%; height: 380px;
    border-radius: 24px;
    background:
      radial-gradient(circle at 50% 50%, rgba(249,115,22,.06), transparent 70%),
      radial-gradient(circle at 70% 30%, rgba(251,191,36,.03), transparent 40%);
    border: 1px dashed rgba(249,115,22,.15);
    overflow: hidden;
    margin-bottom: 20px;
  }
  .player-float {
    position: absolute;
    border-radius: 50%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transition: left 2.5s cubic-bezier(.25,.1,.25,1),
                top 2.5s cubic-bezier(.25,.1,.25,1),
                transform .15s,
                box-shadow .5s;
    cursor: pointer;
    z-index: 2;
  }
  .player-float .pf-avatar {
    font-size: 28px;
    line-height: 1;
    transition: transform .2s;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,.1));
  }
  .player-float .pf-tag {
    font-size: 10px;
    font-weight: 700;
    color: var(--text);
    background: rgba(255,255,255,.85);
    border-radius: 10px;
    padding: 1px 8px;
    margin-top: 2px;
    backdrop-filter: blur(4px);
  }
  .player-float .pf-host {
    font-size: 9px;
    background: var(--gold);
    color: #fff;
    border-radius: 8px;
    padding: 0 6px;
  }
  .player-float .pf-coins {
    font-size: 10px;
    margin-top: 1px;
    color: var(--gold);
    font-weight: 600;
  }
  .player-float.empty {
    background: rgba(255,255,255,.5);
    border: 2px dashed rgba(0,0,0,.08);
    color: var(--text2);
    font-size: 12px;
    animation: none;
    cursor: default;
  }
  .player-float.joined {
    background: var(--card);
    box-shadow: 0 2px 16px rgba(0,0,0,.06);
    animation: drift var(--drift-dur, 4s) ease-in-out infinite;
    animation-delay: var(--drift-delay, 0s);
  }
  .player-float.joined:hover {
    transform: scale(1.12);
    box-shadow: 0 4px 24px rgba(249,115,22,.2);
    z-index: 10;
  }
  .player-float.slot-join-flash {
    animation: scaleInBounce .5s cubic-bezier(.22,.61,.36,1);
    box-shadow: 0 0 0 10px rgba(249,115,22,.25);
    border: 2px solid var(--warm);
  }
  .player-float.converged {
    transition: left 3s cubic-bezier(.22,.61,.36,1),
                top 3s cubic-bezier(.22,.61,.36,1);
    box-shadow: 0 0 20px rgba(34,197,94,.3);
    border: 2px solid var(--success);
  }

  /* ===== Avatar Picker ===== */
  .avatar-picker {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 10px;
    margin-bottom: 20px;
    justify-items: center;
  }
  .avatar-opt {
    width: 44px; height: 44px;
    border-radius: 50%;
    font-size: 24px;
    display: flex; align-items: center; justify-content: center;
    background: var(--card);
    border: 2px solid transparent;
    cursor: pointer;
    transition: transform .15s, border-color .2s, box-shadow .2s;
  }
  .avatar-opt:hover  { transform: scale(1.12); }
  .avatar-opt:active { transform: scale(.92); }
  .avatar-opt.selected {
    border-color: var(--warm);
    box-shadow: 0 0 0 4px rgba(249,115,22,.18);
    transform: scale(1.1);
  }
</style>
</head>
<body>
<div class="bg-orb bg-orb-1"></div>
<div class="bg-orb bg-orb-2"></div>
<div id="toast" class="toast"></div>

<!-- ====== NAME PICK PAGE ====== -->
<div id="page-entry" class="page active">
  <div class="entry-hero">
    <div class="entry-logo">🦊</div>
    <div class="entry-title">三六局</div>
    <div class="entry-sub">线下聚会破冰游戏 · 3轮36问</div>
  </div>
  <p class="hint">选择你的身份</p>
  <div id="profile-list" style="display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-bottom:20px;"></div>
  <div class="entry-btns">
    <button class="btn-big btn-join" onclick="App.showNewName()">✏️ 使用新名字</button>
  </div>
  <div id="new-name-form" style="display:none;margin-top:16px;">
    <div class="input-row">
      <input class="input" id="new-name-input" placeholder="输入你的名字" maxlength="8" autocomplete="off">
    </div>
    <p class="hint" style="margin-bottom:8px;">选一个头像</p>
    <div class="avatar-picker" id="new-name-avatar-picker"></div>
    <div class="actions" style="margin-top:12px;">
      <button class="btn btn-primary" onclick="App.saveNewProfile()">确认</button>
      <button class="btn btn-ghost" onclick="App.hideNewName()">取消</button>
    </div>
  </div>
  <div style="display:flex;gap:10px;justify-content:center;margin-top:24px;">
    <a href="rules.html" style="color:var(--text2);text-decoration:none;font-size:13px;padding:8px 18px;background:var(--card);border-radius:20px;box-shadow:var(--shadow);transition:transform .15s;" onmouseenter="this.style.transform='translateY(-2px)'" onmouseleave="this.style.transform=''">📖 游戏规则</a>
    <a href="penalties.html" style="color:var(--text2);text-decoration:none;font-size:13px;padding:8px 18px;background:var(--card);border-radius:20px;box-shadow:var(--shadow);transition:transform .15s;" onmouseenter="this.style.transform='translateY(-2px)'" onmouseleave="this.style.transform=''">📋 惩罚模板库</a>
  </div>
</div>

<!-- ====== ROLE PICK PAGE ====== -->
<div id="page-role-pick" class="page">
  <div class="entry-hero" style="padding-top:32px;">
    <div class="entry-logo" style="font-size:40px;" id="role-avatar"></div>
    <div class="entry-title" style="font-size:22px;" id="role-name"></div>
  </div>
  <div class="entry-btns">
    <button class="btn-big btn-host" onclick="App.goHost()">🎤 主持聚会</button>
    <button class="btn-big btn-join"  onclick="App.goJoin()">🎭 加入聚会</button>
  </div>
  <button class="btn btn-ghost" style="margin-top:16px;" onclick="App.switchProfile()">🔄 切换身份</button>
</div>

<!-- ====== HOST: WAITING ROOM ====== -->
<div id="page-host-wait" class="page">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;">
    <h2 style="font-size:20px;">🎤 主持人控制台</h2>
    <span id="sync-indicator"><span class="sync-dot on"></span>同步中</span>
  </div>

  <div class="room-bar">
    <div><div class="room-label">房间号</div><div class="room-code" id="host-room-id">------</div></div>
    <div>
      <span class="status-badge status-waiting" id="host-status-badge">等待中</span>
    </div>
  </div>

  <div class="section-title">玩家列表 <span id="host-count">(0/6)</span></div>

function drawPenaltyCandidates() {
  const entries = Object.entries(PENALTIES)

  const shuffled = entries.sort(() => Math.random() - 0.5).slice(0, 5)
  return shuffled.map(([key, val]) => {
    const item = val.items[Math.floor(Math.random() * val.items.length)]
    return { key, label: val.label, icon: val.icon, text: item }
  })
}

async function callAI(prompt, temperature) {
  try {
    const body = { prompt }
    if (temperature != null) body.temperature = temperature
    const resp = await fetch('/api/ai', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    })
    if (!resp.ok) return null
    const data = await resp.json()
    return data.text || null
  } catch (_) {
    return null
  }
}

function aiSay(text, containerId) {
  if (!text) return
  const el = document.getElementById(containerId || 'ai-comment')
  if (!el) return
  el.style.display = ''
  el.textContent = '🤖 ' + text
  el.style.animation = 'none'
  void el.offsetWidth
  el.style.animation = 'slideInRight .4s cubic-bezier(.22,.61,.36,1)'
}

const PROFILES_KEY = 'slj_profiles'
function loadProfiles() { try { return JSON.parse(localStorage.getItem(PROFILES_KEY)) || [] } catch(_) { return [] } }
function saveProfiles(list) { localStorage.setItem(PROFILES_KEY, JSON.stringify(list)) }
function createProfile(name, avatar) {
  return { id: 'p_' + Date.now(), name, avatar, customPenalties: [], createdAt: Date.now(), lastUsed: Date.now() }
}
function touchProfile(id) {
  const list = loadProfiles()
  const p = list.find(x => x.id === id)
  if (p) { p.lastUsed = Date.now(); saveProfiles(list) }
}

function renderProfileList() {
  const el = document.getElementById('profile-list')
  if (!el) return
  const list = loadProfiles()
  if (list.length === 0) {
    el.innerHTML = '<p class="hint">还没有身份记录，创建第一个吧</p>'
    return
  }
  list.sort((a, b) => b.lastUsed - a.lastUsed)
  el.innerHTML = list.map(p =>
    `<div class="profile-chip" onclick="App.selectProfile('${p.id}')" style="
      display:flex;flex-direction:column;align-items:center;gap:4px;
      padding:14px 18px;background:var(--card);border-radius:var(--radius);
      box-shadow:var(--shadow);cursor:pointer;transition:transform .15s;
      min-width:80px;
    " onmouseenter="this.style.transform='translateY(-3px)'" onmouseleave="this.style.transform=''">
      <span style="font-size:32px;">${p.avatar}</span>
      <span style="font-size:13px;font-weight:600;">${p.name}</span>
    </div>`
  ).join('')
}

  room: null,       // { id, status, maxPlayers, round }
  players: [],      // [{ id, nickname, joined, coins, isHost, avatar }]
  heat: {},         // { '1-3': 45, ... }
  crush: {},        // { playerId: [targetId, ...] }
  jealousy: {},     // { playerId: score }
  choiceResult: null,
  penalty: null,
  vote: null,       // { type:'penalty'|'heart', candidates:[], results:{}, open:bool }
  game: {
    question: null, questionLevel: null,
    timerEnd: null, timerRunning: false,
    pairs: null, sparks: {},
    choiceQ: null,
    choiceResults: {}
  }
}

// ============================================================
// BroadcastChannel
// ============================================================
let channel = null
function setupChannel() {
  try {
    channel = new BroadcastChannel(CH)
    channel.onmessage = (e) => handleMessage(e.data)
  } catch (_) {
    // Fallback: use localStorage events for Safari/older browsers
    window.addEventListener('storage', (e) => {
      if (e.key === CH) {
        try { handleMessage(JSON.parse(e.newValue)) } catch (_) {}
      }
    })
  }
}
setupChannel()

function broadcast(msg) {
  const payload = { ...msg, ts: Date.now() }
  if (channel) {
    channel.postMessage(payload)
  } else {
    // localStorage fallback
    localStorage.setItem(CH, JSON.stringify(payload))
  }
}

// ============================================================
// Message Handler
// ============================================================
function handleMessage(msg) {
  const { type, from, data } = msg
  if (from === S.role + '_' + S.playerId) return // ignore own messages

  switch (type) {

    case 'ROOM_STATE':
      // Full state sync from host
      if (S.role === 'player' && data.room.id === S.room?.id) {
        S.room = data.room
        S.players = data.players
        S.heat = data.heat || {}
        S.game = data.game
        render()
      }
      break

    case 'ROOM_STATE_REQUEST':
      if (S.role === 'host' && data.roomId === S.room?.id) {
        broadcast({ type: 'ROOM_STATE', from: 'host_0', data: { room: S.room, players: S.players, game: S.game, heat: S.heat } })
      }
      break

    case 'GAME_STARTED':
      if (S.role === 'player' && data.roomId === S.room?.id) {
        S.room.status = 'playing'
        S.room.round = data.round || 1
        render()
      }
      break

    case 'QUESTION':
      S.game.question = data.question
      S.game.questionLevel = data.level
      S.game.timerEnd = data.timerEnd
      S.game.timerRunning = true
      S.game.choiceQ = data.choiceQ || null
      S.game.choiceResults = {}
      S.choiceResult = null
      render()
      startTimerUI()
      break

    case 'TIMER_TICK':
      S.game.timerEnd = data.timerEnd
      S.game.timerRunning = data.timerRunning
      render()
      if (S.game.timerRunning) startTimerUI()
      break

    case 'COINS_UPDATED':
      if (S.role === 'player') {
        S.players = data.players
        render()
      }
      break

    case 'HEART':
    case 'SPARK':
      if (S.role === 'host') {
        const nm = data.nickname || ('玩家' + data.playerId)
        toast(`${nm} ${type === 'HEART' ? '❤️ 送出了暖心' : '🔥 送出了火花'}`)
        if (!S.crush[data.playerId]) S.crush[data.playerId] = []
        S.players.filter(p => p.joined && p.id !== data.playerId).forEach(p => {
          if (!S.crush[data.playerId].includes(p.id)) S.crush[data.playerId].push(p.id)
        })
        const gain = type === 'HEART' ? 10 : 20
        S.players.filter(p => p.joined).forEach(p => {
          if (p.id !== data.playerId) {
            const k = heatKey(data.playerId, p.id)
            S.heat[k] = Math.min(100, (S.heat[k] || 0) + gain)
          }
        })
        broadcast({ type: 'HEAT_UPDATED', from: 'host_0', data: { heat: S.heat } })
        renderFloatRoom('host-player-room', S.players, S.room.maxPlayers, false)
          // AI comment
        const names = S.players.filter(p => p.joined).map(p => p.nickname || ('玩家'+p.id)).join('、')
        const rn = ROUND_NAMES[S.room.round] || ('第'+S.room.round+'轮')
        callAI(`「${rn}」中${nm}送出了${type === 'HEART' ? '暖心' : '火花'}。在场玩家：${names}。三六局游戏通过36个问题让参与者从陌生走向亲密，暖心代表共鸣和支持。请用一句温暖八卦的话评论。`).then(t => {
          if (t) { aiSay(t); broadcast({ type: 'AI_SAY', from: 'host_0', data: { text: t } }) }
        })
      }
      break

    case 'PLAYER_JOINED':
      if (S.role === 'host' && data.roomId === S.room?.id) {
        const slot = S.players[data.playerId - 1]
        if (slot) {
          slot.joined = true
          slot.nickname = slot.nickname || data.nickname || ('玩家' + data.playerId)
          slot.avatar = data.avatar || '🎭'
        }
        flashNewJoins(S.players)
        broadcast({ type: 'ROOM_STATE', from: 'host_0', data: { room: S.room, players: S.players, game: S.game, heat: S.heat } })
        render()
        // AI welcome
        const nm = data.nickname || ('玩家' + data.playerId)
        const nms = S.players.filter(p => p.joined).map(p => p.nickname || ('玩家'+p.id)).join('、')
        callAI(`玩家"${nm}"加入了三六局房间。在场玩家：${nms}。三六局的36个问题将引导大家从破冰走向深度了解。请用一句幽默欢迎语，暗示接下来的36问之旅。`).then(t => {
          if (t) { aiSay(t); broadcast({ type: 'AI_SAY', from: 'host_0', data: { text: t } }) }
        })
      }
      break

    case 'VOTE_START':
      S.vote = { type: data.vtype, candidates: data.candidates, open: true, results: {} }
      if (S.role === 'player') renderVotePanel()
      if (S.role === 'host') renderVotePanel()
      break

    case 'VOTE_CAST':
      if (S.role === 'host' && S.vote) {
        S.vote.results[data.playerId] = data.choice
        // Check if all joined players voted
        const joined = S.players.filter(p => p.joined)
        const allVoted = joined.every(p => p.id === 1 || S.vote.results[p.id] !== undefined)
        if (allVoted) {
          // Tally
          const tally = {}
          Object.values(S.vote.results).forEach(idx => { tally[idx] = (tally[idx] || 0) + 1 })
          const winner = Object.entries(tally).sort((a, b) => b[1] - a[1])[0]
          S.vote.open = false
          const w = parseInt(winner[0])
          const cand = S.vote.candidates[w]
          S.vote.winner = { index: w, candidate: cand, tally }
          broadcast({ type: 'VOTE_RESULT', from: 'host_0', data: { winner: S.vote.winner } })
        }
        renderVotePanel()
      }
      break

    case 'VOTE_RESULT':
      if (S.vote) {
        S.vote.open = false
        S.vote.winner = data.winner
        renderVotePanel()
        if (S.vote.type === 'penalty' && S.vote.winner) {
          S.penalty = { selected: S.vote.winner.candidate }
          renderPenaltyDisplay()
        }
      }
      break

    case 'AI_SAY':
      aiSay(data.text, S.role === 'player' ? 'player-ai-comment' : 'ai-comment')
      break

    case 'STEAL_ATTEMPT':
      if (S.role === 'host') {
        toast(`${data.playerId}号玩家发动了挖墙脚！`)
        const topPair = Object.entries(S.heat).sort((a, b) => b[1] - a[1])[0]
        if (topPair) {
          S.heat[topPair[0]] = Math.max(0, topPair[1] - 20)
        }
        broadcast({ type: 'HEAT_UPDATED', from: 'host_0', data: { heat: S.heat } })
        renderFloatRoom('host-player-room', S.players, S.room.maxPlayers, false)
        const nm = data.playerId + '号玩家'
        callAI(`轮二「结对轮」中${nm}发动了挖墙脚——TA看到自己有好感的人跟别人默契更高，选择出手干预。请用一句毒舌但不伤人的话评论，体现36问游戏中情感张力的趣味。`).then(t => {
          if (t) { aiSay(t); broadcast({ type: 'AI_SAY', from: 'host_0', data: { text: t } }) }
        })
      }
      break

    case 'HEAT_UPDATED':
      if (S.role === 'player') {
        S.heat = data.heat
        renderFloatRoom('player-wait-room', S.players, S.room?.maxPlayers || 6, false)
      }
      break

    case 'JEALOUSY_UPDATED':
      S.jealousy = data.jealousy
      if (S.role === 'player' && S.jealousy[S.playerId] > 0) {
        toast(`😈 你的嫉妒值: ${S.jealousy[S.playerId]}！轮二可发动挖墙脚`)
      }
      render()
      break

    case 'ROUND_CHANGED':
      S.room.round = data.round
      S.game.question = null
      S.game.timerRunning = false
      render()
      break

    case 'CHOICE_PICK':
      if (S.role === 'host') {
        S.game.choiceResults[data.playerId] = data.choice
        // Match choices boost heat between same-choice players
        const joined = S.players.filter(p => p.joined)
        joined.forEach(p => {
          if (p.id !== data.playerId && S.game.choiceResults[p.id] === data.choice) {
            const k = heatKey(data.playerId, p.id)
            S.heat[k] = Math.min(100, (S.heat[k] || 0) + 15)
          }
        })
        broadcast({ type: 'HEAT_UPDATED', from: 'host_0', data: { heat: S.heat } })
        renderFloatRoom('host-player-room', S.players, S.room.maxPlayers, false)
      }
      break

    case 'PENALTY_CANDIDATES':
      S.penalty = { candidates: data.candidates }
      if (S.role === 'player') renderPenaltyDisplay()
      break

    case 'PENALTY_SELECTED':
      S.penalty = { selected: data.penalty }
      if (S.role === 'player') renderPenaltyDisplay()
      if (S.role === 'host') { renderPenaltyPanel(); render() }
      break

    case 'GAME_ENDED':
      S.heat = data.heat || {}
      convergePlayers()
      if (S.role === 'host') {
        const topPairs = Object.entries(S.heat).sort((a,b) => b[1]-a[1]).slice(0,3)
        const pNames = {}
        S.players.filter(p => p.joined).forEach(p => { pNames[p.id] = p.nickname || ('玩家'+p.id) })
        const pairStr = topPairs.map(([k,v]) => {
          const [a,b] = k.split('-')
          return (pNames[a]||a) + '和' + (pNames[b]||b) + '热度' + v
        }).join('，')
        const dirs = S.roundAnswers ? Object.entries(S.roundAnswers).map(([k,v]) => `轮${k}："${v.question}"→${v.direction}`).join('；') : '无'
        callAI(`三六局36问完成了！热度最高的配对：${pairStr}。各轮回答方向：${dirs}。参考Arthur Aron的36问实验——通过渐进式自我披露可以培养亲密感。请结合各轮实际回答方向，用2-3句话总结，幽默八卦风格。`, 0.8).then(t => {
          if (t) { aiSay(t); broadcast({ type: 'AI_SAY', from: 'host_0', data: { text: t } }) }
        })
      }
      break
  }
}

// ============================================================
// Render Helpers
// ============================================================
function $(id) { return document.getElementById(id) }

function page(name) {
  document.querySelectorAll('.page').forEach(p => {
    p.classList.remove('active', 'exit-left')
  })
  $(name).classList.add('active')
}

function toast(msg) {
  const t = $('toast')
  t.textContent = msg
  t.classList.remove('show')
  void t.offsetWidth // force reflow
  t.classList.add('show')
  clearTimeout(t._t)
  t._t = setTimeout(() => t.classList.remove('show'), 2000)
}

function convergePlayers() {
  const rooms = document.querySelectorAll('.float-room')
  rooms.forEach(room => {
    const floats = room.querySelectorAll('.player-float.joined')
    if (floats.length < 2) return
    const cw = room.clientWidth, ch = 380
    const cx = cw / 2, cy = ch / 2
    // Find pairs with high heat and cluster them
    const pairs = []
    for (let i = 0; i < floats.length; i++) {
      for (let j = i + 1; j < floats.length; j++) {
        const a = parseInt(floats[i].dataset.pid)
        const b = parseInt(floats[j].dataset.pid)
        pairs.push({ a, b, elA: floats[i], elB: floats[j], heat: S.heat[heatKey(a, b)] || 0 })
      }
    }
    pairs.sort((x, y) => y.heat - x.heat)
    // Cluster high-heat pairs toward center, low-heat toward edges
    pairs.forEach((pair, idx) => {
      const pull = pair.heat / 100
      const tx = cx + (idx - pairs.length / 2) * 50 - 30
      const ty = cy - 20
      pair.elA.classList.add('converged')
      pair.elB.classList.add('converged')
      pair.elA.style.left = (tx - 20 - pull * 20) + 'px'
      pair.elA.style.top  = ty + 'px'
      pair.elB.style.left = (tx + 40 + pull * 20) + 'px'
      pair.elB.style.top  = ty + 'px'
    })
  })
}

// Track previous joined count to detect new joins
let _prevJoinedIds = new Set()
function flashNewJoins(players) {
  const currentIds = new Set(players.filter(p => p.joined).map(p => p.id))
  currentIds.forEach(id => {
    if (!_prevJoinedIds.has(id)) {
      const rooms = document.querySelectorAll('.float-room')
      rooms.forEach(room => {
        const slot = room.querySelector('.player-float.joined[data-pid="' + id + '"]')
        if (slot) {
          slot.classList.remove('slot-join-flash')
          void slot.offsetWidth
          slot.classList.add('slot-join-flash')
        }
      })
    }
  })
  _prevJoinedIds = new Set(currentIds)
}

function calcFloatPositions(players, heat, cw, ch) {
  // cw/ch = container dimensions; player elements are ~70px
  const margin = 54
  const joined = players.filter(p => p.joined)
  const n = joined.length || 1
  const cx = cw / 2, cy = ch / 2
  const rx = cw / 2 - margin, ry = ch / 2 - margin
  // base positions on ellipse
  const bases = joined.map((p, i) => {
    const angle = (i / n) * Math.PI * 2 - Math.PI / 2
    return {
      id: p.id,
      bx: cx + rx * Math.cos(angle) - 32,
      by: cy + ry * Math.sin(angle) - 32
    }
  })
  // apply heat attraction
  const positions = bases.map(b => {
    let tx = b.bx, ty = b.by
    const total = bases.length
    bases.forEach(b2 => {
      if (b.id === b2.id) return
      const h = heat[heatKey(b.id, b2.id)] || 0
      const pull = h / 100 * 60
      tx += (b2.bx - b.bx) * (pull / (total * 5))
      ty += (b2.by - b.by) * (pull / (total * 5))
    })
    // clamp to container
    return {
      id: b.id,
      x: Math.max(4, Math.min(cw - 64, tx)),
      y: Math.max(4, Math.min(ch - 64, ty))
    }
  })
  return positions
}

function renderFloatRoom(containerId, players, max, showCoins) {
  const room = $(containerId)
  if (!room) return
  const cw = room.clientWidth || 340, ch = 380
  const positions = calcFloatPositions(players, S.heat, cw, ch)
  let html = ''
  for (let i = 0; i < max; i++) {
    const p = players[i]
    const pos = positions.find(pp => pp.id === (p ? p.id : i + 1))
    const px = pos ? pos.x : 0
    const py = pos ? pos.y : 0
    if (p && p.joined) {
      const size = max <= 3 ? 80 : max <= 5 ? 72 : 64
      const driftX = ((p.id % 3) * 6 + 4) + 'px'
      const driftY = ((p.id % 2) * 8 + 3) + 'px'
      const driftDur = (3.5 + (p.id * 0.7) % 3) + 's'
      const driftDelay = (p.id * 0.3).toFixed(1) + 's'
      html += `<div class="player-float joined" data-pid="${p.id}" style="
        left:${px}px; top:${py}px;
        width:${size}px; height:${size}px;
        --drift-x:${driftX}; --drift-y:${driftY};
        --drift-dur:${driftDur}; --drift-delay:${driftDelay};
      ">
        <div class="pf-avatar">${p.avatar || '🎭'}</div>
        ${p.isHost ? '<div class="pf-host">房主</div>' : ''}
        <div class="pf-tag">${p.nickname || '玩家'+p.id}</div>
        ${showCoins ? `<div class="pf-coins">🪙 ${p.coins || 0}</div>` : ''}
      </div>`
    } else {
      const size = 64
      html += `<div class="player-float empty" style="
        left:${px}px; top:${py}px;
        width:${size}px; height:${size}px;
      ">${i + 1}</div>`
    }
  }
  room.innerHTML = html
}

function renderVotePanel() {
  // Host and player both see vote panel when a vote is active
  const hostPanel = $('penalty-panel')
  const playerPanel = $('player-penalty-display')
  if (!S.vote) return

  const renderCandidates = (container) => {
    if (!container) return
    if (S.vote.open) {
      const joined = S.players?.filter(p => p.joined) || []
      const votedCount = Object.keys(S.vote.results).length
      container.innerHTML = `
        <div class="section-title">${S.vote.type === 'penalty' ? '🎲 投票惩罚' : '💗 投票暖心'} (${votedCount}/${joined.length}已投)</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;">
          ${S.vote.candidates.map((c, i) =>
            `<button class="btn" style="background:var(--card);border:1px solid #E7E5E4;padding:8px;font-size:12px;text-align:left;"
              ${S.role === 'player' && !S.vote.results[S.playerId] ? `onclick="App.playerVote(${i})"` : ''}
              ${S.vote.results[S.playerId] === i ? 'style="border:2px solid var(--warm)!important;background:var(--warm-light)!important;"' : ''}
            >${c.icon} <b>${c.label}</b><br><span style="color:var(--text2);">${c.text}</span></button>`
          ).join('')}
        </div>`
    } else if (S.vote.winner) {
      const w = S.vote.winner
      container.innerHTML = `
        <div style="text-align:center;padding:12px;background:var(--card);border-radius:var(--radius);">
          <div style="font-size:32px;">🏆</div>
          <div style="font-weight:700;">${w.candidate.icon} ${w.candidate.label}</div>
          <div style="font-size:14px;color:var(--text2);">${w.candidate.text}</div>
          <div style="font-size:12px;color:var(--text2);margin-top:4px;">${Object.entries(w.tally).map(([k,v]) => S.vote.candidates[k].label + ':' + v + '票').join(' · ')}</div>
        </div>`
    }
  }

  if (S.role === 'host') {
    if (hostPanel) { hostPanel.style.display = ''; renderCandidates(hostPanel) }
  }
  if (S.role === 'player') {
    if (playerPanel) { playerPanel.style.display = ''; renderCandidates(playerPanel) }
  }
}

function renderPenaltyPanel() {
  const panel = $('penalty-panel')
  const candidatesEl = $('penalty-candidates')
  const resultEl = $('penalty-result')
  if (!panel) return
  if (S.room?.status !== 'playing') { panel.style.display = 'none'; return }
  panel.style.display = ''
  if (S.penalty?.selected) {
    candidatesEl.style.display = 'none'
    resultEl.style.display = ''
    const p = S.penalty.selected
    resultEl.innerHTML = `<div style="font-size:32px;">${p.icon}</div><div style="font-weight:700;">${p.label}</div><div style="font-size:14px;color:var(--text2);">${p.text}</div>`
  } else if (S.penalty?.candidates) {
    candidatesEl.style.display = 'grid'
    resultEl.style.display = 'none'
    candidatesEl.innerHTML = S.penalty.candidates.map(c =>
      `<button class="btn" style="background:var(--card);border:1px solid #E7E5E4;padding:10px;text-align:left;font-size:13px;" onclick="App.hostPenaltySelect('${c.key}')">${c.icon} <b>${c.label}</b><br><span style="color:var(--text2);">${c.text}</span></button>`
    ).join('')
  }
}

function renderPenaltyDisplay() {
  const el = $('player-penalty-display')
  if (!el) return
  if (S.penalty?.selected) {
    el.style.display = ''
    const p = S.penalty.selected
    el.innerHTML = `<div style="font-size:32px;">${p.icon}</div><div style="font-weight:700;font-size:16px;">${p.label}</div><div style="font-size:14px;color:var(--text2);margin-top:4px;">${p.text}</div>`
  } else {
    el.style.display = 'none'
  }
}

function renderConsolePlayers() {
  const el = $('console-players')
  if (!el) return
  let html = ''
  S.players.filter(p => p.joined).forEach((p, i) => {
    html += `<div class="coin-row">
      <span class="player-tag">${p.isHost ? '👑' : '🎭'} ${p.nickname || ('玩家'+p.id)}</span>
      <div class="coin-btns">
        <button class="coin-btn minus" onclick="App.hostCoin(${i},-1)">−</button>
        <span style="font-weight:700;min-width:24px;text-align:center;">${p.coins || 0}</span>
        <button class="coin-btn plus"  onclick="App.hostCoin(${i},1)">+</button>
      </div>
    </div>`
  })
  el.innerHTML = html || '<p class="hint">暂无玩家</p>'
}

let timerInterval = null
function startTimerUI() {
  clearInterval(timerInterval)
  timerInterval = setInterval(() => {
    if (!S.game.timerRunning) { clearInterval(timerInterval); return }
    const remain = Math.max(0, Math.ceil(((S.game.timerEnd || 0) - Date.now()) / 1000))
    const tEls = [$('console-timer'), $('player-timer')].filter(Boolean)
    tEls.forEach(el => {
      el.textContent = remain
      if (remain <= 10) el.classList.add('warn')
      else el.classList.remove('warn')
    })
    if (remain <= 0) {
      S.game.timerRunning = false
      clearInterval(timerInterval)
      if (S.role === 'host') {
        broadcast({ type: 'TIMER_TICK', from: 'host_0', data: { timerEnd: S.game.timerEnd, timerRunning: false } })
        // Generate answer direction options
        if (S.game.question && !S.roundAnswers?.[S.room.round]) {
          App.hostGenerateDirections()
        }
      }
    }
  }, 200)
}

// ============================================================
// Full Render
// ============================================================
function render() {
  updateSyncIndicator()

  // --- Host Waiting ---
  if (S.role === 'host' && S.room?.status === 'waiting') {
    $('host-room-id').textContent = S.room.id
    $('host-count').textContent = `(${S.players.filter(p=>p.joined).length}/${S.room.maxPlayers})`
    renderFloatRoom('host-player-room', S.players, S.room.maxPlayers, false)
    const joined = S.players.filter(p => p.joined).length
    const btn = $('host-start-btn')
    btn.disabled = joined < 3
    btn.textContent = joined >= 3 ? '开始游戏！' : `开始游戏（至少3人，当前${joined}人）`
  }

  // --- Host Console ---
  if (S.role === 'host' && S.room?.status === 'playing') {
    $('console-round').textContent = ROUND_NAMES[S.room.round] || '第' + S.room.round + '轮'
    const qEl = $('console-question')
    if (S.game.question) {
      qEl.textContent = `[L${S.game.questionLevel}] ${S.game.question}`
      qEl.classList.remove('empty')
    } else {
      qEl.textContent = '点击下方按钮抽取问题'
      qEl.classList.add('empty')
    }
    // Show/hide draw button based on whether question is already drawn
    $('console-draw-btn').style.display = S.game.question ? 'none' : ''
    const aiBtn = $('console-ai-draw-btn')
    if (aiBtn) aiBtn.style.display = S.game.question ? 'none' : ''
    // Show penalty/vote panel
    const penaltyPanel = $('penalty-panel')
    if (penaltyPanel) {
      if (!S.game.question && S.room.round >= 3 && !S.vote) {
        $('penalty-panel').style.display = ''
        $('penalty-candidates').style.display = ''
        $('penalty-candidates').innerHTML = `
          <button class="btn btn-primary" onclick="App.hostStartVote('penalty')" style="margin-bottom:6px;">🗳️ 投票惩罚</button>
          <button class="btn btn-ghost" onclick="App.hostStartVote('heart')">💗 投票暖心</button>`
        $('penalty-result').style.display = 'none'
      }
      if (S.vote) { renderVotePanel() }
      else { renderPenaltyPanel() }
    }
    renderConsolePlayers()
  }

  // --- Player Board ---
  if (S.role === 'player') {
    $('player-room-id').textContent = S.room?.id || '------'
    if (S.room?.status === 'waiting') {
      $('player-waiting-area').style.display = ''
      $('player-game-area').style.display = 'none'
      $('player-status-badge').textContent = '等待中'
      $('player-status-badge').className = 'status-badge status-waiting'
      renderFloatRoom('player-wait-room', S.players, S.room?.maxPlayers || 6, false)
    } else if (S.room?.status === 'playing') {
      $('player-waiting-area').style.display = 'none'
      $('player-game-area').style.display = ''
      $('player-status-badge').textContent = '游戏中'
      $('player-status-badge').className = 'status-badge status-playing'

      const qEl = $('player-question')
      if (S.game.question) {
        qEl.textContent = `[L${S.game.questionLevel}] ${S.game.question}`
        qEl.classList.remove('empty')
      } else {
        qEl.textContent = '等待主持人出题…'
        qEl.classList.add('empty')
      }

      // Show spark button only in round 2
      $('player-spark-btn').style.display = S.room.round === 2 ? '' : 'none'
      // Show steal button if jealous in round 2
      const stealBtn = $('player-steal-btn')
      if (stealBtn) {
        const jScore = S.jealousy?.[S.playerId] || 0
        stealBtn.style.display = (S.room.round === 2 && jScore > 0) ? '' : 'none'
        if (jScore > 0) {
          stealBtn.querySelector('small').textContent = `挖墙脚(${jScore})`
        }
      }

      // Choice question panel (round 2)
      const choicePanel = $('player-choice-panel')
      if (S.game.choiceQ && !S.choiceResult) {
        choicePanel.style.display = ''
        $('player-choice-q').textContent = S.game.choiceQ.q
        $('player-choice-a').textContent = S.game.choiceQ.a
        $('player-choice-b').textContent = S.game.choiceQ.b
        $('player-choice-a').style.borderColor = '#E7E5E4'
        $('player-choice-a').style.background = 'var(--card)'
        $('player-choice-b').style.borderColor = '#E7E5E4'
        $('player-choice-b').style.background = 'var(--card)'
      } else {
        choicePanel.style.display = 'none'
      }

      // Penalty display
      renderPenaltyDisplay()
    }
  }
}

function updateSyncIndicator() {
  const dots = document.querySelectorAll('.sync-dot')
  dots.forEach(d => { d.className = 'sync-dot on' })
}

// ============================================================
// App Actions
// ============================================================
const App = {

  // --- Profile ---
  showNewName() {
    $('profile-list').style.display = 'none'
    $('new-name-form').style.display = ''
    const picker = $('new-name-avatar-picker')
    picker.innerHTML = AVATARS.map(a =>
      `<div class="avatar-opt" data-avatar="${a}" onclick="App.pickNewAvatar('${a}', this)">${a}</div>`
    ).join('')
    setTimeout(() => $('new-name-input')?.focus(), 200)
  },

  hideNewName() {
    $('profile-list').style.display = ''
    $('new-name-form').style.display = 'none'
    renderProfileList()
  },

  _newAvatar: null,
  pickNewAvatar(avatar, el) {
    this._newAvatar = avatar
    document.querySelectorAll('#new-name-avatar-picker .avatar-opt').forEach(o => o.classList.remove('selected'))
    el.classList.add('selected')
  },

  saveNewProfile() {
    const name = $('new-name-input').value.trim()
    if (!name) { toast('请输入名字'); return }
    if (!this._newAvatar) { toast('请选择一个头像'); return }
    const profile = createProfile(name, this._newAvatar)
    const list = loadProfiles()
    list.push(profile)
    saveProfiles(list)
    this._newAvatar = null
    this.selectProfile(profile.id)
  },

  selectProfile(id) {
    const list = loadProfiles()
    const profile = list.find(p => p.id === id)
    if (!profile) return
    touchProfile(id)
    S.profile = profile
    $('role-avatar').textContent = profile.avatar
    $('role-name').textContent = profile.name
    page('page-role-pick')
  },

  switchProfile() {
    S.profile = null
    renderProfileList()
    page('page-entry')
  },

  goEntry() {
    clearInterval(timerInterval)
    S.profile = null; S.role = null; S.playerId = null; S.room = null; S.players = []; S.heat = {}; S.crush = {}; S.jealousy = {}; S.choiceResult = null; S.penalty = null; S.vote = null; S.roundAnswers = null; S.game = { question: null, questionLevel: null, timerEnd: null, timerRunning: false, pairs: null, sparks: {}, choiceQ: null, choiceResults: {} }
    _prevJoinedIds = new Set()
    renderProfileList()
    page('page-entry')
  },

  // --- Host ---
  goHost() {
    _prevJoinedIds = new Set()
    S.role = 'host'; S.playerId = 0; S.heat = {}; S.crush = {}; S.jealousy = {}; S.vote = null
    const roomId = genRoomId()
    const maxP = 6
    S.room = { id: roomId, status: 'waiting', maxPlayers: maxP, round: 0 }
    const av = S.profile?.avatar || '🦊'
    const nm = S.profile?.name || '房主'
    S.players = [{ id: 1, nickname: nm, joined: true, coins: 0, isHost: true, avatar: av }]
    for (let i = 2; i <= maxP; i++) {
      S.players.push({ id: i, nickname: '', joined: false, coins: 0, isHost: false, avatar: null })
    }
    page('page-host-wait')
    render()
    broadcast({ type: 'ROOM_STATE', from: 'host_0', data: { room: S.room, players: S.players, game: S.game, heat: S.heat } })
  },

  hostStartGame() {
    S.room.status = 'playing'
    S.room.round = 1
    page('page-host-console')
    render()
    broadcast({ type: 'GAME_STARTED', from: 'host_0', data: { roomId: S.room.id, round: 1 } })
  },

  hostDrawQuestion(useAI) {
    const round = S.room.round
    if (useAI) {
      const roundName = ROUND_NAMES[round] || ('第' + round + '轮')
      const names = S.players.filter(p => p.joined).map(p => p.nickname || ('玩家'+p.id)).join('、')
      const prevDirs = S.roundAnswers ? Object.values(S.roundAnswers).map(d => d.direction).join('、') : ''
      callAI(`三六局游戏第${round}轮「${roundName}」。在场玩家：${names}。${prevDirs ? '前几轮大家的关注方向：' + prevDirs + '。请避免重复相似话题。' : ''}
三六局的36问按心理学"渐进式自我披露"设计：
- 轮一破冰：轻松日常，消除陌生感
- 轮二结对：价值观和情感，建立信任
- 轮三默契：灵魂深度对话，检验默契

请生成一道「${roundName}」级别的问题。可以天马行空但要符合这轮的深度。只返回问题本身，不加前缀，不超过30字。`, 0.9).then(q => {
        if (q) {
          S.game.question = q.trim()
          S.game.questionLevel = 'AI'
          S.game.timerEnd = Date.now() + 30000
          S.game.timerRunning = true
          if (round === 2) {
            S.game.choiceQ = CHOICE_QS[Math.floor(Math.random() * CHOICE_QS.length)]
            S.game.choiceResults = {}
          } else { S.game.choiceQ = null }
          render()
          startTimerUI()
          broadcast({ type: 'QUESTION', from: 'host_0', data: { question: q.trim(), level: 'AI', timerEnd: S.game.timerEnd, choiceQ: S.game.choiceQ || null } })
        }
      })
      return
    }
    let poolKey
    if (round === 1) poolKey = 'L1'
    else if (round === 2) poolKey = Math.random() < 0.5 ? 'L2' : 'L3'
    else poolKey = 'L4'
    const pool = POOL[poolKey]
    const question = pool[Math.floor(Math.random() * pool.length)]
    S.game.question = question
    S.game.questionLevel = poolKey.replace('L', '')
    S.game.timerEnd = Date.now() + 30000
    S.game.timerRunning = true
    if (round === 2) {
      S.game.choiceQ = CHOICE_QS[Math.floor(Math.random() * CHOICE_QS.length)]
      S.game.choiceResults = {}
    } else {
      S.game.choiceQ = null
    }
    render()
    startTimerUI()
    broadcast({ type: 'QUESTION', from: 'host_0', data: {
      question, level: poolKey.replace('L',''),
      timerEnd: S.game.timerEnd,
      choiceQ: S.game.choiceQ || null
    }})
  },

  hostNextRound() {
    if (S.room.round >= 3) {
      toast('🎉 三轮结束！看看谁和谁走到了一起…')
      broadcast({ type: 'GAME_ENDED', from: 'host_0', data: { heat: S.heat } })
      convergePlayers()
      return
    }
    // Jealousy calculation: at end of round 1, check who has unrequited crushes
    if (S.room.round === 1) {
      S.jealousy = {}
      const topPairs = Object.entries(S.heat).sort((a, b) => b[1] - a[1]).slice(0, 2)
      S.players.filter(p => p.joined && !p.isHost).forEach(p => {
        const crushes = S.crush[p.id] || []
        // Check if any crush target is in a top pair with someone else
        topPairs.forEach(([key, val]) => {
          const [a, b] = key.split('-').map(Number)
          if (crushes.includes(a) && b !== p.id && val > 30) {
            S.jealousy[p.id] = (S.jealousy[p.id] || 0) + 1
          }
          if (crushes.includes(b) && a !== p.id && val > 30) {
            S.jealousy[p.id] = (S.jealousy[p.id] || 0) + 1
          }
        })
      })
      broadcast({ type: 'JEALOUSY_UPDATED', from: 'host_0', data: { jealousy: S.jealousy } })
    }
    S.room.round++
    S.game.question = null
    S.game.timerEnd = null
    S.game.timerRunning = false
    S.game.choiceQ = null
    clearInterval(timerInterval)
    render()
    broadcast({ type: 'ROUND_CHANGED', from: 'host_0', data: { round: S.room.round } })
  },

  hostCoin(idx, delta) {
    const p = S.players.filter(pl => pl.joined)[idx]
    if (!p) return
    p.coins = Math.max(0, (p.coins || 0) + delta)
    renderConsolePlayers()
    broadcast({ type: 'COINS_UPDATED', from: 'host_0', data: { players: S.players } })
  },

  hostPenaltyDraw() {
    const candidates = drawPenaltyCandidates()
    S.penalty = { candidates }
    broadcast({ type: 'PENALTY_CANDIDATES', from: 'host_0', data: { candidates } })
    renderPenaltyPanel()
  },

  hostPenaltySelect(key) {
    const candidate = S.penalty?.candidates?.find(c => c.key === key)
    if (!candidate) return
    S.penalty = { ...S.penalty, selected: candidate }
    broadcast({ type: 'PENALTY_SELECTED', from: 'host_0', data: { penalty: candidate } })
    renderPenaltyPanel()
    toast(`${candidate.icon} ${candidate.label}：${candidate.text}`)
  },

  hostStartVote(vtype) {
    let candidates = []
    if (vtype === 'penalty') {
      const sys = drawPenaltyCandidates()
      const customPool = []
      const all = loadProfiles()
      all.forEach(prof => {
        if (prof.customPenalties && prof.customPenalties.length > 0) {
          prof.customPenalties.forEach(cp => { if (Math.random() < 0.3) customPool.push(cp) })
        }
      })
      candidates = [...sys.map(s => ({ label: s.label, icon: s.icon, text: s.text })), ...customPool].slice(0, 8)
    } else {
      candidates = S.players.filter(p => p.joined).map(p => ({
        label: p.nickname || ('玩家' + p.id), icon: p.avatar || '🎭', text: '获得💗'
      }))
    }
    S.vote = { type: vtype, candidates, open: true, results: {} }
    broadcast({ type: 'VOTE_START', from: 'host_0', data: { vtype, candidates } })
    renderVotePanel()
  },

  playerVote(idx) {
    if (!S.vote?.open) { toast('投票已结束'); return }
    S.vote.results[S.playerId] = idx
    broadcast({ type: 'VOTE_CAST', from: 'player_' + S.playerId, data: { playerId: S.playerId, choice: idx } })
    toast('已投票！')
    renderVotePanel()
  },

  // --- Answer direction picker ---
  hostPickDirection(direction) {
    if (!S.roundAnswers) S.roundAnswers = {}
    S.roundAnswers[S.room.round] = { question: S.game.question, direction }
    $('direction-picker').style.display = 'none'
    toast('已记录：' + direction)
    // AI commentary with direction context
    const names = S.players.filter(p => p.joined).map(p => p.nickname || ('玩家'+p.id)).join('、')
    callAI(`三六局第${S.room.round}轮「${ROUND_NAMES[S.room.round]}」，题目"${S.game.question}"，大家的回答方向是"${direction}"。在场玩家：${names}。请用1句温暖的话点评这轮的氛围，结合36问递进逻辑。`, 0.8).then(t => {
      if (t) { aiSay(t); broadcast({ type: 'AI_SAY', from: 'host_0', data: { text: t } }) }
    })
  },

  hostGenerateDirections() {
    if (!S.game.question) return
    $('direction-picker').style.display = ''
    $('direction-btns').innerHTML = '<span style="color:var(--text2);font-size:12px;">AI 分析中…</span>'
    const rn = ROUND_NAMES[S.room.round] || ('第'+S.room.round+'轮')
    callAI(`三六局第${S.room.round}轮「${rn}」，题目："${S.game.question}"。请预测玩家可能的回答方向，给出3-4个简短标签（每个4-8字），覆盖常见回答方向。一行一个，纯文本，不加编号。`, 0.7).then(t => {
      if (t) {
        const lines = t.split('\n').filter(l => l.trim()).slice(0, 4)
        if (lines.length === 0) lines.push('其他')
        $('direction-btns').innerHTML = lines.map(l =>
          `<button class="btn" style="flex:1;min-width:80px;padding:8px 12px;font-size:13px;background:var(--card);border:1px solid #E7E5E4;" onclick="App.hostPickDirection('${l.replace(/'/g, "\\'")}')">${l}</button>`
        ).join('') + `<button class="btn" style="flex:1;min-width:80px;padding:8px 12px;font-size:13px;background:var(--card);border:1px solid #E7E5E4;" onclick="App.hostPickDirection('其他')">💬 其他</button>`
      }
    })
  },

  // --- Steal mechanic (round 2) ---
  playerSteal(targetId) {
    if (!S.jealousy || S.jealousy[S.playerId] <= 0) { toast('嫉妒值不足！'); return }
    S.jealousy[S.playerId]--
    // Double weight for choice question
    S.choiceResult = S.choiceResult || 'a'
    broadcast({ type: 'STEAL_ATTEMPT', from: 'player_' + S.playerId, data: { playerId: S.playerId, targetId } })
    toast('🗡️ 挖墙脚！你的选择权重翻倍！')
    // Also re-send choice with 2x weight
    broadcast({ type: 'CHOICE_PICK', from: 'player_' + S.playerId, data: { playerId: S.playerId, choice: S.choiceResult, weight: 2 } })
  },

  // --- Player ---
  goJoin() {
    S.role = 'player'
    page('page-player-join')
    const av = S.profile?.avatar || '🎭'
    const nm = S.profile?.name || '玩家'
    $('join-profile-label').textContent = `${av} ${nm}`
    $('join-btn').disabled = false
    setTimeout(() => $('join-input')?.focus(), 300)
  },

  playerJoin() {
    const input = $('join-input')
    const roomId = input.value.trim().toUpperCase()
    if (roomId.length < 6) { toast('请输入完整的房间号'); return }

    S.room = { id: roomId, status: 'waiting', maxPlayers: 6, round: 0 }
    S.playerId = Math.floor(Math.random() * 5) + 2 // 2-6
    const av = S.profile?.avatar || '🎭'
    const nm = S.profile?.name || '玩家'
    S.players = [{ id: 1, nickname: '房主', joined: true, coins: 0, isHost: true, avatar: '🦊' }]
    page('page-player-board')
    $('player-label').textContent = `${av} ${nm} (${S.playerId}号)`
    render()

    broadcast({ type: 'PLAYER_JOINED', from: 'player_' + S.playerId, data: {
      roomId, playerId: S.playerId, nickname: nm, avatar: av
    }})
    // The host will respond with ROOM_STATE, which updates our player list

    // Fallback: if no host responds within 2s, show what we know
    setTimeout(() => {
      if (S.players.filter(p => p.joined).length <= 1) {
        // Request full state
        broadcast({ type: 'ROOM_STATE_REQUEST', from: 'player_' + S.playerId, data: { roomId } })
      }
      render()
    }, 500)
  },

  playerHeart() {
    const nm = S.profile?.name || ('玩家' + S.playerId)
    broadcast({ type: 'HEART', from: 'player_' + S.playerId, data: { playerId: S.playerId, nickname: nm } })
    toast('❤️ 暖心已发送！')
    const btn = $('player-heart-btn')
    if (btn) { btn.classList.remove('flash'); void btn.offsetWidth; btn.classList.add('flash') }
  },

  playerSpark() {
    const nm = S.profile?.name || ('玩家' + S.playerId)
    broadcast({ type: 'SPARK', from: 'player_' + S.playerId, data: { playerId: S.playerId, nickname: nm } })
    toast('🔥 火花已发送！')
    const btn = $('player-spark-btn')
    if (btn) { btn.classList.remove('flash'); void btn.offsetWidth; btn.classList.add('flash') }
  },

  playerPickChoice(choice) {
    S.choiceResult = choice
    broadcast({ type: 'CHOICE_PICK', from: 'player_' + S.playerId, data: { playerId: S.playerId, choice } })
    // Highlight selected button
    $('player-choice-a').style.borderColor = choice === 'a' ? 'var(--warm)' : '#E7E5E4'
    $('player-choice-a').style.background = choice === 'a' ? 'var(--warm-light)' : 'var(--card)'
    $('player-choice-b').style.borderColor = choice === 'b' ? 'var(--warm)' : '#E7E5E4'
    $('player-choice-b').style.background = choice === 'b' ? 'var(--warm-light)' : 'var(--card)'
    toast(choice === 'a' ? '选了 A！' : '选了 B！')
  }
}

// ============================================================
// Initialize
// ============================================================
document.addEventListener('DOMContentLoaded', () => {
  renderProfileList()
  const params = new URLSearchParams(window.location.search)
  const role = params.get('role')
  const id = params.get('id')
  const room = params.get('room')

  if (role === 'host' && id) {
    S.profile = { id: 'url', name: '主持人', avatar: '🦊' }
    App.goHost()
  } else if (role === 'player' && id && room) {
    S.profile = { id: 'url', name: '玩家' + id, avatar: '🎭' }
    S.role = 'player'; S.playerId = parseInt(id) || 1
    S.room = { id: room, status: 'waiting', maxPlayers: 6, round: 0 }
    page('page-player-board')
    $('player-label').textContent = `🎭 玩家 ${S.playerId}`
    render()
    broadcast({ type: 'PLAYER_JOINED', from: 'player_' + S.playerId, data: {
      roomId: room, playerId: S.playerId, nickname: '玩家' + S.playerId, avatar: '🎭'
    }})
  }
  // Default: profile picker already rendered on page-entry
})

// ============================================================
// Keyboard shortcut
// ============================================================
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    const joinInput = $('join-input')
    if (joinInput && document.activeElement === joinInput) {
      App.playerJoin()
    }
  }
})
